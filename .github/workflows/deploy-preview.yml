# GitHub Actions Workflow for NEXUS Preview Deployment
# Deploys to GitHub Pages on push to main branch

name: Deploy NEXUS Preview to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scimspt-platform/**'  # Ignore the other project
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTH: true
      NODE_ENV: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make deploy script executable
        run: chmod +x deploy-github-pages.sh

      - name: Build static export (API routes excluded)
        run: ./deploy-github-pages.sh
        env:
          DISABLE_AUTH: true
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "Checking build output..."
          if [ ! -f "out/index.html" ]; then
            echo "❌ Error: index.html not found in out/"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.html_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        if: success()
        run: |
          echo "🎉 **Deployment Successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Live URL" >> $GITHUB_STEP_SUMMARY
          echo "🌐 https://testdemoqwenai2025-creator.github.io/The-Challenge-Future/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What's Included" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Landing page with hero, features, pricing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Authentication UI (demo mode)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dashboard preview (7 intelligence widgets)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dark theme UI" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Mobile responsive design" >> $GITHUB_STEP_SUMMARY

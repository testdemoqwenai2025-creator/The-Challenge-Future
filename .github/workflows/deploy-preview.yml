# GitHub Actions Workflow for NEXUS Preview Deployment
# Deploys to GitHub Pages on push to main branch

name: Deploy NEXUS Preview to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches: [main]
  
  # Also allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTH: true
      NODE_ENV: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make deploy script executable
        run: chmod +x deploy-github-pages.sh

      - name: Build static export (API routes excluded)
        run: ./deploy-github-pages.sh
        env:
          DISABLE_AUTH: true
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "Checking build output..."
          if [ ! -f "out/index.html" ]; then
            echo "❌ Error: index.html not found in out/"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: |
          echo "🎉 Deployment successful!"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
